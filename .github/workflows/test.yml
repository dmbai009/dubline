name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    # Windows like the players: the e2e suite drives the runner's preinstalled Chrome
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:electron:editor
